[metadata]
name = future-sections
version = 2026.12.4
description = Django app for managing future section requests in MyCE
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Canusia/package_future_sections
author = Avi Kadaji
author_email = avi@canusia.com
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 3.2
    Framework :: Django :: 4.0
    Framework :: Django :: 4.1
    Framework :: Django :: 4.2
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
include_package_data = True
packages = find:
python_requires = >=3.8
install_requires =
    Django>=3.2

# myce_cis is optional (package_future_sections#9): campus-scoped school
# pickers use cis.highschool_scope when package-cis >= 0.1.7a is installed and
# keep the admin's own schools otherwise, so a tenant with an in-repo cis can
# still install this package. Install with `future-sections[campus]` to pull it.
[options.extras_require]
campus = myce_cis>=0.1.7a

[options.packages.find]
exclude =
    tests*
